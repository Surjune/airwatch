# --- ओवरव्यू ---------------------------------------------------------------------

[screens.overview]
title = "ओवरव्यू पेज"

[[screens.overview.sections]]
heading = "यह पेज किस लिए है"
text = """
यह ओवरव्यू पेज है, और शुरुआत यहीं से करें। यहाँ आपके चुने हुए शहर की हवा का इस
समय का हाल दिखता है। शहर बदलने के लिए स्क्रीन के सबसे ऊपर शहर का नाम चुनें।
बारीक धूल PM2.5 और मोटी धूल PM10 के बीच बदलने के लिए, शीर्षक के पास वाले बटन दबाएँ।
"""

[[screens.overview.sections]]
heading = "अभी का हाल"
text = """
पहला भाग, Right now, CPCB का जारी किया हुआ आधिकारिक AQI दिखाता है, और शहर के हर
सरकारी मॉनिटर की ताज़ा रीडिंग भी। रंग राष्ट्रीय पैमाने के हैं: हरा मतलब अच्छी हवा,
फिर पीला और नारंगी, और गहरा लाल मतलब बहुत गंभीर।
"""

[[screens.overview.sections]]
heading = "नेटवर्क क्या देख सकता है"
text = """
दूसरा भाग बताता है कि इस शहर के बारे में कौन-कौन सी जानकारी है: सटीक सरकारी
मॉनिटर, सस्ते कम्युनिटी सेंसर, सैटेलाइट, और नागरिकों की भेजी हुई रीडिंग। हर एक को
अलग गिना जाता है, ताकि साफ़ दिखे कि शहर में कहाँ अच्छी निगरानी है और कहाँ नहीं।
"""

[[screens.overview.sections]]
heading = "अचानक बढ़ा प्रदूषण"
text = """
तीसरे भाग में हॉटस्पॉट हैं। हॉटस्पॉट वह मॉनिटर है जो कई घंटों तक, अपने आसपास के
अनुमान से कहीं ज़्यादा प्रदूषण दिखाता है। किसी एक आग, फ़ैक्टरी या निर्माण स्थल का
धुआँ इसी तरह पकड़ में आता है, भले ही शहर का औसत सामान्य लगे। ये कहाँ हैं, यह देखने
के लिए Open the map दबाएँ।
"""

[[screens.overview.sections]]
heading = "किसे बताया गया"
text = """
चौथा भाग दिखाता है कि हर जगह के ज़िम्मेदार अधिकारियों को कौन-से अलर्ट भेजे गए।
पाँचवाँ भाग पूरी प्रक्रिया क़दम-दर-क़दम समझाता है। अपनी फ़ोटो या सेंसर रीडिंग भेजने
के लिए Contribute खोलें।
"""

# --- लाइव मैप --------------------------------------------------------------------

[screens.map]
title = "लाइव मैप"

[[screens.map.sections]]
heading = "मैप कैसे पढ़ें"
text = """
यह लाइव मैप है। हर भरा हुआ गोला एक सरकारी मॉनिटर है, और उसका रंग उसकी ताज़ा रीडिंग
बताता है। किसी गोले पर टैप या क्लिक करें, तो मॉनिटर का नाम, रीडिंग और मापने का समय
दिखेगा। ज़ूम करने के लिए दो उँगलियों से फैलाएँ, या प्लस और माइनस बटन दबाएँ।
"""

[[screens.map.sections]]
heading = "और परतें"
text = """
मैप के ऊपर के बटन कम पक्की जानकारी जोड़ते हैं। कम्युनिटी सेंसर टूटी लकीर वाले घेरों
के रूप में दिखते हैं, और नागरिकों की रीडिंग छोटे चौकोर के रूप में। Satellite NO₂,
अंतरिक्ष से मापी गई नाइट्रोजन डाइऑक्साइड को मैप पर रंग से दिखाता है। हर परत अलग ढंग
से बनी है, ताकि कोई भी सरकारी मॉनिटर जैसी न लगे।
"""

[[screens.map.sections]]
heading = "हॉटस्पॉट"
text = """
हॉटस्पॉट वे जगहें हैं जहाँ रीडिंग आसपास के अनुमान से बहुत ऊपर है। कंप्यूटर पर इनकी
सूची दाईं ओर है। फ़ोन पर, नीचे की Detected hotspots पट्टी दबाकर सूची खोलें। हर
हॉटस्पॉट में रीडिंग, अनुमानित मान, और यह कितनी देर रहा, यह दिखता है।
"""

[[screens.map.sections]]
heading = "संभावित स्रोत"
text = """
हर हॉटस्पॉट के नीचे, Possible sources हवा की दिशा को पीछे की ओर देखकर आसपास की आग,
कूड़े के ढेर और फ़ैक्टरियों को प्रतिशत के साथ क्रम में रखता है। ये जाँच करने लायक
जगहें हैं, इस बात का सबूत नहीं कि प्रदूषण किसने फैलाया।
"""

[[screens.map.sections]]
heading = "अगर मैप खाली हो"
text = """
अगर कुछ न दिखे, तो स्क्रीन पर लिखा संदेश पढ़ें। खाली मैप का मतलब हो सकता है कि शहर
में मॉनिटर बहुत कम हैं, या डेटा लोड नहीं हो पाया। इसका मतलब कभी यह नहीं कि हवा
साफ़ है।
"""

# --- पूर्वानुमान --------------------------------------------------------------------

[screens.corridor]
title = "पूर्वानुमान पेज"

[[screens.corridor.sections]]
heading = "रास्ता चुनें"
text = """
यह पेज व्यस्त रास्तों, जैसे हाईवे और औद्योगिक सड़कों, पर हवा का पूर्वानुमान दिखाता
है। पहले, ऊपर के कार्डों में से एक रास्ता चुनें। फिर चुनें कि कितना आगे देखना है:
चौबीस, अड़तालीस या बहत्तर घंटे।
"""

[[screens.corridor.sections]]
heading = "रंगीन पट्टियाँ"
text = """
रंगीन पट्टी रास्ते की शुरुआत से अंत तक जाती है, और हर रंग हवा की गुणवत्ता का एक
स्तर है। दूसरी पट्टी ऊपरी सीमा है, यानी पूर्वानुमान और उसकी अनिश्चितता मिलाकर।
बच्चे, बुज़ुर्ग या दमा के मरीज़ के लिए फ़ैसला करते समय दूसरी पट्टी को मानें।
"""

[[screens.corridor.sections]]
heading = "रास्ते के खाली हिस्से"
text = """
जहाँ कोई मॉनिटर पास में नहीं है, वहाँ पूर्वानुमान नहीं होता, और पेज बताता है कि कितने
किलोमीटर छूट गए। उन हिस्सों को साफ़ नहीं, अनजाना मानें।
"""

[[screens.corridor.sections]]
heading = "कब निकलें"
text = """
When to travel पैनल दिन के अलग-अलग समय पर निकलने की तुलना करता है, और बताता है कि
बेहतर समय पर निकलने से आप कितना प्रदूषण कम झेलेंगे। अगर यह फ़र्क़ पूर्वानुमान की
अपनी ग़लती से छोटा हो, तो यह कोई समय नहीं सुझाता।
"""

[[screens.corridor.sections]]
heading = "यह क्या नहीं बता सकता"
text = """
यह पूर्वानुमान दिन का आम पैटर्न जानता है, कि हवा आम तौर पर कब बेहतर और कब बदतर
होती है। यह नहीं बता सकता कि कल की हवा आज से ख़राब होगी।
"""

# --- अधिकारी कंसोल ---------------------------------------------------------------

[screens.alerts]
title = "अधिकारी कंसोल"

[[screens.alerts.sections]]
heading = "यह पेज किस लिए है"
text = """
यह अधिकारी कंसोल है, जहाँ एक हॉटस्पॉट किसी की ज़िम्मेदारी बनता है। हर अलर्ट उस
ज़िला प्रशासन को जाता है, जिसकी सीमा के अंदर हॉटस्पॉट है।
"""

[[screens.alerts.sections]]
heading = "ऊपर के चार आँकड़े"
text = """
ऊपर के चार आँकड़े गिनते हैं: खुले अलर्ट, वे अलर्ट जिनकी समय-सीमा बीत गई और जवाब
नहीं आया, सीमा के पार भेजे गए अनुरोध, और वे अलर्ट जो दर्ज तो हुए पर अभी भेजे नहीं गए।
"""

[[screens.alerts.sections]]
heading = "सीमा के पार"
text = """
जब प्रदूषण का संभावित स्रोत पड़ोसी ज़िले या राज्य में हो, तो वहाँ के अधिकारियों से भी
कार्रवाई करने को कहा जाता है। सिर्फ़ ऐसे अनुरोध देखने के लिए फ़िल्टर में Across a
boundary चुनें। फ़िल्टर से खुले, हल हो चुके, या सभी अलर्ट भी देखे जा सकते हैं।
"""

[[screens.alerts.sections]]
heading = "अलर्ट पर कार्रवाई"
text = """
अधिकारी ऑपरेटर कुंजी से Sign in करते हैं। फिर वे अलर्ट को Acknowledge कर सकते हैं,
और क्या कार्रवाई हुई यह लिखकर उसे Resolve कर सकते हैं। बाक़ी सभी लोग हर अलर्ट पढ़
सकते हैं, पर उसे बदल नहीं सकते।
"""

[[screens.alerts.sections]]
heading = "Google Gemini का सारांश"
text = """
किसी भी अलर्ट पर Summarise with Gemini दबाएँ, तो आसान भाषा में छोटा सारांश और पहला
सुझाया गया क़दम मिलेगा। Google का Gemini AI इसे सिर्फ़ उसी अलर्ट के आँकड़ों से लिखता है,
और दिखाने से पहले एयरवॉच उसमें लिखे हर आँकड़े की जाँच करता है।
"""

# --- फ़ेडरेशन ---------------------------------------------------------------------

[screens.federation]
title = "फ़ेडरेशन पेज"

[[screens.federation.sections]]
heading = "यह पेज किस लिए है"
text = """
यह पेज दिखाता है कि शहर अपना डेटा सौंपे बिना एक-दूसरे से कैसे सीखते हैं। हर शहर अपनी
रीडिंग पर पूर्वानुमान का मॉडल ख़ुद सिखाता है, और सिर्फ़ मॉडल की सीखी हुई बातें साझा
करता है, रीडिंग कभी नहीं।
"""

[[screens.federation.sections]]
heading = "हर शहर का नोड"
text = """
चित्र और तालिका हर शहर का नोड दिखाते हैं: उसके पास कितने मॉनिटर हैं, हाल में कितनों
ने रीडिंग भेजी, और कितनी रीडिंग जमा हैं। जिस नोड पर stale या no data लिखा है, वह
अभी ज़्यादा योगदान नहीं दे सकता।
"""

[[screens.federation.sections]]
heading = "क्या साझा करने से फ़ायदा हुआ"
text = """
नीचे के कार्ड हर शहर के लिए जाँचते हैं कि साझा मॉडल, शहर के अपने मॉडल से बेहतर
पूर्वानुमान देता है या नहीं, ऐसे डेटा पर जो किसी मॉडल ने पहले नहीं देखा। हर नतीजे
के साथ एक दायरा दिया गया है, और पेज फ़ायदा या नुक़सान तभी बताता है जब वह दायरा साफ़ हो।
"""

[[screens.federation.sections]]
heading = "ईमानदार जवाब"
text = """
अभी का डेटा यह साबित नहीं कर पाता कि साझा करने से फ़ायदा होता है, और पेज यह साफ़-साफ़
कहता है। आख़िरी कार्ड बताता है कि किस सबूत से यह बात तय होगी।
"""

# --- योगदान -----------------------------------------------------------------------

[screens.citizen]
title = "योगदान पेज"

[[screens.citizen.sections]]
heading = "यह पेज किस लिए है"
text = """
यहाँ आप अपने आसपास जो देखते हैं, वह जोड़ सकते हैं। इसमें तीन टैब हैं: Photograph,
Sensor reading, और Your reports।
"""

[[screens.citizen.sections]]
heading = "फ़ोटो भेजना"
text = """
फ़ोटो भेजने के लिए, दिन के उजाले में ऐसी तस्वीर लें जिसमें खुला आसमान और दूर तक का
नज़ारा हो। अँधेरी, धुंधली या बहुत चमकीली फ़ोटो स्वीकार नहीं होती, क्योंकि उनमें साफ़
हवा भी प्रदूषित दिखती है। फिर Use my location दबाएँ, या अक्षांश और देशांतर ख़ुद लिखें।
"""

[[screens.citizen.sections]]
heading = "Google Gemini क्या देखता है"
text = """
फ़ोटो भेजने के बाद Google का Gemini AI उसे देखकर बताता है कि उसमें क्या दिख रहा है, जैसे
कचरा जलना या निर्माण की धूल, और वह कितना निश्चित है। यह आपकी शिकायत में मदद के लिए एक
सुझाव है, कोई माप या सबूत नहीं। भेजने से पहले आपकी लोकेशन की जानकारी हटा दी जाती है, और
फ़ोटो रखी नहीं जाती।
"""

[[screens.citizen.sections]]
heading = "सेंसर रीडिंग भेजना"
text = """
अगर आपके घर में हवा मापने वाला सेंसर है, तो Sensor reading चुनें। लिखें कि वह PM2.5
दिखाता है या PM10, उसका मान, सेंसर का मॉडल, उसने कब मापा, और सेंसर कहाँ है। आपकी
रीडिंग की तुलना सबसे पास के सरकारी मॉनिटर से की जाती है।
"""

[[screens.citizen.sections]]
heading = "अपनी शिकायत लिखना"
text = """
दोनों में से किसी के साथ आप चुन सकते हैं कि आपने क्या देखा, जैसे खुले में कचरा जलाना,
फ़ैक्टरी का धुआँ या निर्माण की धूल, और उसे अपने शब्दों में हिंदी, तमिल या अंग्रेज़ी
में लिख सकते हैं।
"""

[[screens.citizen.sections]]
heading = "आपकी PDF रिपोर्ट"
text = """
भेजने के बाद आपको एक रेफ़रेंस नंबर और Download PDF report बटन मिलता है। रिपोर्ट में
लिखा होता है कि आपने क्या बताया, क्या मापा गया, सबसे पास का मॉनिटर कौन-सा है, और उस
जगह के लिए ज़िम्मेदार अधिकारी कौन हैं, ताकि आप इसे शिकायत के साथ लगा सकें। Your
