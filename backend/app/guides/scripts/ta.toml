[screens.map]
title = "நேரடி வரைபடம்"

[[screens.map.sections]]
heading = "வரைபடத்தைப் படிப்பது எப்படி"
text = """
இது நேரடி வரைபடம். நிரப்பப்பட்ட ஒவ்வொரு வட்டமும் ஒரு அரசு கண்காணிப்பு நிலையம்; அதன்
நிறம் சமீபத்திய அளவீட்டைக் காட்டுகிறது. ஒரு வட்டத்தைத் தொட்டால் அல்லது கிளிக் செய்தால்,
நிலையத்தின் பெயர், அளவீடு, அளந்த நேரம் ஆகியவை தெரியும். பெரிதாக்க, இரண்டு விரல்களால்
விரியுங்கள், அல்லது கூட்டல், கழித்தல் பொத்தான்களை அழுத்துங்கள்.
"""

[[screens.map.sections]]
heading = "கூடுதல் அடுக்குகள்"
text = """
வரைபடத்தின் மேலே உள்ள பொத்தான்கள், அவ்வளவு உறுதியில்லாத தகவல்களைச் சேர்க்கின்றன.
சமூக சென்சார்கள் புள்ளிக்கோட்டு வளையங்களாகவும், பொதுமக்களின் அளவீடுகள் சிறிய
சதுரங்களாகவும் தெரியும். விண்வெளியிலிருந்து அளக்கப்பட்ட நைட்ரஜன் டை ஆக்சைடை,
Satellite NO₂ வரைபடத்தில் நிறமாகக் காட்டுகிறது. ஒவ்வொன்றும் வெவ்வேறு விதமாக
வரையப்படுவதால், எதுவும் அரசு நிலையம் போலத் தோன்றாது.
"""

[[screens.map.sections]]
heading = "ஹாட்ஸ்பாட்கள்"
text = """
சுற்றுப்புறக் கணிப்பைவிட மிக அதிகமாகக் காட்டும் இடங்களே ஹாட்ஸ்பாட்கள். கணினியில்
அவற்றின் பட்டியல் வலது பக்கத்தில் இருக்கும். கைபேசியில், கீழே உள்ள Detected hotspots
பட்டையைத் தொட்டுப் பட்டியலைத் திறங்கள். ஒவ்வொன்றிலும் அளவீடு, எதிர்பார்த்த மதிப்பு,
அது எவ்வளவு நேரம் நீடித்தது என்பவை இருக்கும்.
"""

[[screens.map.sections]]
heading = "சாத்தியமான மூலங்கள்"
text = """
ஒவ்வொரு ஹாட்ஸ்பாட்டின் கீழும், Possible sources காற்றின் திசையைப் பின்னோக்கித் தடம்
பிடித்து, அருகிலுள்ள தீ, குப்பைக் கிடங்குகள், தொழிற்சாலைகளைச் சதவீதத்துடன்
வரிசைப்படுத்துகிறது. இவை ஆய்வு செய்ய வேண்டிய இடங்கள் மட்டுமே; மாசுக்கு யார் காரணம்
என்பதற்கான ஆதாரம் அல்ல.
"""

[[screens.map.sections]]
heading = "வரைபடம் காலியாக இருந்தால்"
text = """
எதுவும் தெரியவில்லை என்றால், திரையில் உள்ள செய்தியைப் படியுங்கள். நகரத்தில் கண்காணிப்பு
நிலையங்கள் மிகக் குறைவு, அல்லது தரவு ஏற்றப்படவில்லை என்று அதற்குப் பொருள் இருக்கலாம்.
காற்று சுத்தமாக உள்ளது என்று ஒருபோதும் பொருள் இல்லை.
"""

# --- முன்னறிவிப்பு -----------------------------------------------------------------

[screens.corridor]
title = "முன்னறிவிப்புப் பக்கம்"

[[screens.corridor.sections]]
heading = "வழியைத் தேர்ந்தெடுங்கள்"
text = """
நெடுஞ்சாலைகள், தொழிற்பேட்டைச் சாலைகள் போன்ற பரபரப்பான வழிகளில் காற்றின் நிலையை இந்தப்
பக்கம் முன்கூட்டியே கணிக்கிறது. முதலில், மேலே உள்ள அட்டைகளில் ஒரு வழியைத்
தேர்ந்தெடுங்கள். பிறகு எவ்வளவு முன்னால் பார்க்க வேண்டும் என்று தேர்ந்தெடுங்கள்:
இருபத்து நான்கு, நாற்பத்தெட்டு, அல்லது எழுபத்திரண்டு மணி நேரம்.
"""

[[screens.corridor.sections]]
heading = "நிறப் பட்டைகளைப் படிப்பது"
text = """
நிறப் பட்டை, வழியின் தொடக்கத்திலிருந்து முடிவு வரை நீள்கிறது; ஒவ்வொரு நிறமும்
காற்றுத் தரத்தின் ஒரு நிலை. இரண்டாவது பட்டை மேல் வரம்பு, அதாவது கணிப்புடன் அதன்
நிச்சயமின்மையும் சேர்ந்தது. குழந்தைகள், முதியவர்கள், ஆஸ்துமா உள்ளவர்களுக்காக
முடிவெடுக்கும்போது, இரண்டாவது பட்டையைப் பின்பற்றுங்கள்.
"""

[[screens.corridor.sections]]
heading = "வழியில் உள்ள இடைவெளிகள்"
text = """
அருகில் கண்காணிப்பு நிலையம் இல்லாத பகுதிகளுக்குக் கணிப்பு இருக்காது; எத்தனை
கிலோமீட்டர் விடுபட்டுள்ளது என்று பக்கம் சொல்லும். அந்தப் பகுதிகளைச் சுத்தமானவை என்று
அல்ல, தெரியாதவை என்றே கருதுங்கள்.
"""

[[screens.corridor.sections]]
heading = "எப்போது பயணிப்பது"
text = """
When to travel பகுதி, நாளின் வெவ்வேறு நேரங்களில் புறப்படுவதை ஒப்பிட்டு, நல்ல நேரத்தில்
புறப்பட்டால் எவ்வளவு மாசைத் தவிர்க்கலாம் என்று காட்டுகிறது. அந்த வேறுபாடு கணிப்பின்
சொந்தப் பிழையைவிடச் சிறியதாக இருந்தால், அது எந்த நேரத்தையும் பரிந்துரைக்காது.
"""

[[screens.corridor.sections]]
heading = "இதனால் சொல்ல முடியாதது"
text = """
காற்று வழக்கமாக எப்போது நன்றாகவும் எப்போது மோசமாகவும் இருக்கும் என்ற, ஒரு நாளின்
பொதுவான முறையை இந்தக் கணிப்பு அறியும். நாளை இன்றைவிட மோசமாக இருக்கும் என்று இதனால்
