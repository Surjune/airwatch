# குரல் வழிகாட்டி, தமிழில்.
#
# ஒவ்வொரு பத்தியும் திரையில் எழுத்தாகக் காட்டப்பட்டு, தனியாகப் பேசப்படுகிறது.
# பொத்தான்களின் பெயர்களை ("Open the map") திரையில் உள்ளபடியே ஆங்கிலத்தில் வைக்கவும்,
# கேட்பவர் அவற்றைக் கண்டுபிடிக்க முடியும். எழுதுவது ஒரு விதமாகவும் சொல்வது வேறு
# விதமாகவும் உள்ள சொற்கள் [spoken] பகுதியில் உள்ளன.

language = "ta"

[spoken]
"PM2.5" = "பிஎம் டூ பாயிண்ட் ஃபைவ்"
"PM10" = "பிஎம் டென்"
"NO₂" = "என் ஓ டூ"
"CPCB" = "சி பி சி பி"
"AQI" = "ஏ க்யூ ஐ"
"PDF" = "பி டி எஃப்"
"AI" = "ஏ ஐ"
"AirWatch" = "ஏர்வாட்ச்"

