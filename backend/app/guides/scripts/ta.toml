[screens.overview]
title = "மேலோட்டப் பக்கம்"

[[screens.overview.sections]]
heading = "இந்தப் பக்கம் எதற்கு"
text = """
இது Overview பக்கம்; இங்கிருந்தே தொடங்குங்கள். நீங்கள் தேர்ந்தெடுத்த நகரத்தின்
காற்றின் தற்போதைய நிலையை இது காட்டுகிறது. நகரத்தை மாற்ற, திரையின் மேலே உள்ள நகரப்
பெயரைத் தேர்ந்தெடுங்கள். நுண்ணிய தூசி PM2.5, பெரிய தூசி PM10 இவற்றுக்கு இடையே மாற,
தலைப்பின் அருகில் உள்ள பொத்தான்களை அழுத்துங்கள்.
"""

[[screens.overview.sections]]
heading = "இப்போதைய நிலை"
text = """
முதல் பகுதி, Right now, CPCB வெளியிட்ட அதிகாரப்பூர்வ AQI அளவையும், நகரத்தில் உள்ள
ஒவ்வொரு அரசு கண்காணிப்பு நிலையத்தின் சமீபத்திய அளவீட்டையும் காட்டுகிறது. நிறங்கள்
தேசிய அளவுகோலின்படி உள்ளன: பச்சை என்றால் நல்ல காற்று, பிறகு மஞ்சள், ஆரஞ்சு; அடர்
சிவப்பு என்றால் மிகக் கடுமையானது.
"""

[[screens.overview.sections]]
heading = "நெட்வொர்க் எதைப் பார்க்க முடியும்"
text = """
இந்த நகரத்துக்கு என்னென்ன தகவல்கள் உள்ளன என்பதை இரண்டாம் பகுதி எண்ணிக் காட்டுகிறது:
துல்லியமான அரசு கண்காணிப்பு நிலையங்கள், விலை குறைந்த சமூக சென்சார்கள், செயற்கைக்கோள்
தரவு, பொதுமக்கள் அனுப்பிய அளவீடுகள். ஒவ்வொன்றும் தனியாக எண்ணப்படுவதால், நகரத்தில்
எங்கே நல்ல கண்காணிப்பு உள்ளது, எங்கே இல்லை என்பது தெளிவாகத் தெரியும்.
"""

[[screens.overview.sections]]
heading = "எதிர்பாராத மாசு"
text = """
மூன்றாம் பகுதியில் ஹாட்ஸ்பாட்கள் உள்ளன. ஹாட்ஸ்பாட் என்பது, சுற்றியுள்ள நிலையங்கள்
கணித்ததைவிடப் பல மணி நேரம் மிக அதிகமாகக் காட்டும் ஒரு கண்காணிப்பு நிலையம். நகரச்
சராசரி சாதாரணமாகத் தெரிந்தாலும், ஒரு தீ, ஒரு தொழிற்சாலை அல்லது ஒரு கட்டுமான இடத்தின்
மாசு இப்படித்தான் கண்டுபிடிக்கப்படுகிறது. அவை எங்கே என்று பார்க்க Open the map
அழுத்துங்கள்.
"""

[[screens.overview.sections]]
heading = "யாருக்குத் தெரிவிக்கப்பட்டது"
text = """
ஒவ்வொரு இடத்துக்கும் பொறுப்பான அதிகாரிகளுக்கு அனுப்பப்பட்ட எச்சரிக்கைகளை நான்காம்
பகுதி காட்டுகிறது. முழுச் செயல்முறையையும் ஐந்தாம் பகுதி படிப்படியாக விளக்குகிறது.
உங்கள் புகைப்படத்தையோ சென்சார் அளவீட்டையோ சேர்க்க, Contribute பக்கத்தைத் திறங்கள்.
"""

